name: Build and deploy resume site

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # A cancelled deploy can leave Pages serving a half-updated artifact;
  # let each run finish and simply queue behind it instead.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Cache Puppeteer's Chromium download
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Check index.html matches README (source of truth)
        run: npm run check

      - name: Generate PDF
        run: npm run pdf

      - name: Prepare site artifact
        run: |
          mkdir _site
          cp index.html _site/
          cp styles.css _site/
          cp script.js _site/
          cp -r fonts _site/
          cp Oleksandr_Bielov_Resume.pdf _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
